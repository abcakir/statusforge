name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: statusforge
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: statusforge
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Create test database
        run: psql -h localhost -U statusforge -c "CREATE DATABASE statusforge_test;"
        env:
          PGPASSWORD: ci_password

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://statusforge:ci_password@localhost:5432/statusforge
          REDIS_URL: redis://localhost:6379
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: statusforge
          KEYCLOAK_CLIENT_ID: statusforge-backend
          KEYCLOAK_CLIENT_SECRET: ci_dummy
          SECRET_KEY: ci_secret_key
          ENVIRONMENT: test
          LOG_LEVEL: WARNING
        run: python -m pytest tests/ -v
